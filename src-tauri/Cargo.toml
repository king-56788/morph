[package]
name = "morph"
version = "1.0.0"
description = "Fast offline file converter for Windows with radial UI"
authors = ["Morph Contributors"]
edition = "2021"

[lib]
name = "morph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
lopdf = "0.34"
csv = "1.3"
